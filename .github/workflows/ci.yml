name: CI

# Builds the app and runs the tests on every pull request and on every push to main.
# The tests use fakes: they need no dev stack, no database and no sibling checkout.
# Tests that read fb-travel-monolith read the pinned snapshot in Tests/Fixtures/monolith-snapshot.
# The tests that run a monolith script need TR_INTEGRATION=1 and skip themselves here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run of the old push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The cache holds compiled code, so its key names the compiler that made it.
      - name: Show the toolchain
        id: toolchain
        run: |
          swift --version
          echo "hash=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}

      - name: Check the syntax of the build scripts
        run: bash -n build.sh && bash -n release.sh && bash -n scripts/smoke.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test
